# --- Window Settings ---
[general]
import = ["~/.config/alacritty/colors.toml"]

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "full"
opacity = 0.90
blur = true # Works on macOS and some Linux Wayland compositors
title = "Alacritty"
class = { instance = "Alacritty", general = "Alacritty" }

# --- Font Settings ---
[font]
# I recommend 'JetBrainsMono Nerd Font Mono' for proper terminal spacing
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
size = 12.0

[font.offset]
x = 0
y = 1 # Adds a tiny bit of line spacing for readability

# --- Cursor ---
[cursor]
style = { shape = "Beam", blinking = "On" }
thickness = 0.15

# --- Mouse ---
[mouse]
hide_when_typing = true

# --- Colors (Tokyo Night Theme) ---
# --- End of Config ---

[terminal.shell]
program = "/home/ahmed/.local/bin/shell"

# --- Keyboard Shortcuts ---
[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
