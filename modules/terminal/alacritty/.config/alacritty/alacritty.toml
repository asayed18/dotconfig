# --- Window Settings ---
[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "full"
opacity = 0.90
blur = true # Works on macOS and some Linux Wayland compositors
title = "Alacritty"
class = { instance = "Alacritty", general = "Alacritty" }

# --- Font Settings ---
[font]
# I recommend 'JetBrainsMono Nerd Font Mono' for proper terminal spacing
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
size = 12.0

[font.offset]
x = 0
y = 1 # Adds a tiny bit of line spacing for readability

# --- Cursor ---
[cursor]
style = { shape = "Beam", blinking = "On" }
thickness = 0.15

# --- Mouse ---
[mouse]
hide_when_typing = true

# --- Colors (Tokyo Night Theme) ---
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[terminal.shell]
program = "/home/ahmed/.local/bin/shell"

# --- Keyboard Shortcuts ---
[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"